[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smartfs"
version = "0.7.0"
description = "Linux-native semantic file management with AI tagging and xattr metadata"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SmartFS" }]
dependencies = [
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "watchdog>=4.0,<6",
  "keyring>=25,<26",
]

[project.optional-dependencies]
ai = [
  "google-genai>=1.0,<2",
  "fastembed>=0.4,<1",
  "numpy>=1.26,<3",
]
gui = ["PySide6>=6.7,<7"]
test = ["pytest>=8.0", "pytest-timeout>=2.3"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
smartfs = "smartfs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartfs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:smartfs.*",
  "ignore:'_UnionGenericAlias' is deprecated.*:DeprecationWarning:google.genai.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
